[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
publish-jobs = ["./publish-crates"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["THIRD_PARTY_NOTICES.md"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Installers create a `git-blamr` alias so `git blamr` works without shipping
# a second copy of the static binary. Archives contain only `blamr`.
[dist.bin-aliases]
blamr = ["git-blamr"]

# Custom permissions for the crates.io publish job
[dist.github-custom-job-permissions.publish-crates]
contents = "read"
