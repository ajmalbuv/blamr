[package]
name = "blamr"
version = "0.0.4"
edition = "2024"
rust-version = "1.88"
description = "Concurrent git-blame author attribution and line statistics"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ajmalbuv/blamr"
exclude = [".github/**"]

[dependencies]
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
pretty_assertions = "1"

[[bin]]
name = "blamr"
path = "src/bin/blamr.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

# Release archives only contain the static musl build on Linux. Make glibc
# hosts resolve to those archives instead of looking for a nonexistent gnu
# artifact.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-x86_64-unknown-linux-musl/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-aarch64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-aarch64-unknown-linux-musl/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
